    function render() {
      const root = document.getElementById('feed');
      FEED.items.forEach(item => {
        const el = document.createElement('article');
        el.className = 'item';
        el.innerHTML = `
          <div class="meta">${item.category} • ${item.publishedAt} • ${item.rankLabel || ''}</div>
          <h2>${item.title}</h2>
          <div class="excerpt">${item.excerpt || ''}</div>
          ${item.image ? `<img class="hero" src="${item.image}" alt="">` : ''}
          <div class="show-body">
            <button class="open">Abrir matéria</button>
            <button class="copy secondary">Copiar título</button>
          </div>
          <div class="body" style="display:none;">
            ${item.body ? item.body.map(p=>`<p>${p}</p>`).join('') : ''}
            <div class="sources">${item.sourceLabel || ''} — <a href="${item.sourceUrl || '#'}" target="_blank">fonte</a></div>
          </div>
        `;
        const btn = el.querySelector('button.open');
        const copyBtn = el.querySelector('button.copy');
        const bodyEl = el.querySelector('.body');
        btn.addEventListener('click', ()=>{ bodyEl.style.display = bodyEl.style.display === 'none' ? 'block' : 'none'; btn.textContent = bodyEl.style.display === 'none' ? 'Abrir matéria' : 'Fechar matéria'; });
        copyBtn.addEventListener('click', ()=>{ navigator.clipboard?.writeText(item.title).then(()=> copyBtn.textContent='Copiado'); setTimeout(()=>copyBtn.textContent='Copiar título',1500); });
        root.appendChild(el);
      });
    }

    render();
  </script>
