    // render embedded feed
    render(feed.items);

    function render(items){
      const container = document.getElementById('feed');
      container.innerHTML = '';
      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <h2 class="title">${escapeHtml(item.title)}</h2>
          <div class="meta">${item.publishedAt} — ${item.category}</div>
          ${item.image?`<img src="${escapeHtml(item.image)}" alt="">`:''}
          <div class="excerpt">${escapeHtml(item.excerpt)}</div>
          <button class="toggle" data-slug="${escapeHtml(item.slug)}">Abrir texto</button>
          <div class="body" id="body-${escapeHtml(item.slug)}" style="display:none"></div>
          <div class="sources" id="sources-${escapeHtml(item.slug)}" style="display:none"></div>
        `;
        container.appendChild(div);
        div.querySelector('.toggle').addEventListener('click', async (e) => {
          const slug = e.currentTarget.dataset.slug;
          const bodyEl = document.getElementById('body-'+slug);
          const srcEl = document.getElementById('sources-'+slug);
          if(bodyEl.style.display === 'none'){
            bodyEl.innerHTML = item.body.map(p => `<p>${escapeHtml(p)}</p>`).join('\n');
            srcEl.innerHTML = '<strong>Fontes:</strong> ' + (item.sources||[]).map(s=>`<a href="${escapeHtml(s.url)}" target="_blank">${escapeHtml(s.label)}</a>`).join(' • ');
            bodyEl.style.display = 'block'; srcEl.style.display = 'block';
            e.currentTarget.textContent = 'Fechar texto';
          } else {
            bodyEl.style.display = 'none'; srcEl.style.display = 'none';
            e.currentTarget.textContent = 'Abrir texto';
          }
        });
      });
    }

    function escapeHtml(s){
      if(!s) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
