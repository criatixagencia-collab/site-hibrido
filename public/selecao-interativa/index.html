<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seleção Interativa — BuzzPop</title>
<style>
*,::after,::before{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#fafafa;line-height:1.5}
.container{max-width:860px;margin:0 auto;padding:1.5rem 1rem}
.header h1{font-size:clamp(1.3rem,4vw,2rem);font-weight:900;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.25rem}
.header p{color:#888;font-size:.82rem;margin-bottom:1rem}
.header .hint{color:#facc15;font-size:.78rem;margin-bottom:1.5rem;padding:.5rem .7rem;background:#141414;border:1px solid #333;border-radius:8px}
.stats{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.2rem;padding:.65rem 1rem;background:#141414;border:1px solid #222;border-radius:10px;font-size:.8rem}
.stats span{display:flex;align-items:center;gap:.35rem}
.stats strong{color:#facc15;font-size:.95rem}
.card{background:#141414;border:1px solid #222;border-radius:12px;margin-bottom:1rem;overflow:hidden;transition:border-color .2s,border-width .2s}
.card.approved{border-color:#22c55e;border-width:2px;background:#142014}
.card.rejected{border-color:#ef4444;border-width:2px;background:#201414;opacity:.6}
.card-body{padding:1rem}
.card-header{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.5rem}
.badge{font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;padding:.2rem .5rem;border-radius:6px}
.cat-badge{background:#c12222;color:#fff}
.score-badge{background:#1a1a1a;border:1px solid #333;color:#facc15}
.card-title{font-size:1rem;font-weight:700;color:#fafafa;line-height:1.3;margin-bottom:.25rem;display:flex;align-items:flex-start;gap:.35rem}
.card-num{display:inline-flex;align-items:center;justify-content:center;min-width:1.4rem;height:1.4rem;background:#c12222;color:#fff;border-radius:4px;font-size:.68rem;font-weight:900;flex-shrink:0;margin-top:1px}
.card-excerpt{font-size:.82rem;color:#aaa;margin-bottom:.5rem;margin-left:1.75rem}
.card-body-toggle{font-size:.7rem;color:#facc15;cursor:pointer;text-decoration:underline;display:inline-block;margin-bottom:.5rem;margin-left:1.75rem}
.card-body-toggle:hover{color:#fff}
.card-fullbody{font-size:.85rem;color:#ccc;line-height:1.55;margin-bottom:.5rem;display:none;padding:.55rem;background:#0f0f0f;border-radius:6px;border:1px solid #222;margin-left:0}
.card-fullbody.show{display:block}
.card-fullbody p{margin-bottom:.6rem}
.card-fullbody p:last-child{margin-bottom:0}

/* Image selection area */
.img-select{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0 .75rem}
.img-opt{position:relative;width:calc(33.33% - .3rem);min-width:130px;border-radius:8px;overflow:hidden;border:2px solid #333;cursor:pointer;opacity:.65;transition:all .15s;background:#0a0a0a;flex:1}
.img-opt:hover{opacity:.9;border-color:#666}
.img-opt.selected{opacity:1;border-color:#22c55e;box-shadow:0 0 10px #22c55e33}
.img-opt img{width:100%;height:100px;object-fit:cover;display:block;background:#1a1a1a}
.img-opt .img-label{display:flex;align-items:center;justify-content:center;gap:.25rem;padding:.2rem;font-size:.58rem;color:#888;text-transform:uppercase;letter-spacing:.05em;background:#0f0f0f}
.img-opt.selected .img-label{color:#22c55e;font-weight:700}

.actions{display:flex;gap:.4rem;margin-top:.5rem}
.btn{flex:1;padding:.5rem;border:none;border-radius:8px;font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;transition:all .12s}
.btn-approve{background:#1a3a1a;color:#22c55e;border:1px solid #22c55e33}
.btn-approve:hover,.btn-approve.active{background:#22c55e;color:#000}
.btn-approve.active{box-shadow:0 0 10px #22c55e33}
.btn-reject{background:#3a1a1a;color:#ef4444;border:1px solid #ef444433}
.btn-reject:hover,.btn-reject.active{background:#ef4444;color:#fff}
.btn-reject.active{box-shadow:0 0 10px #ef444433}

.output-section{background:#0f0f0f;border:1px solid #333;border-radius:12px;padding:1rem;margin-top:1.5rem;position:sticky;bottom:0}
.output-section h3{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:#888;margin-bottom:.4rem}
.output-box{background:#050505;border:1px solid #222;border-radius:8px;padding:.65rem;font-family:monospace;font-size:.75rem;color:#facc15;white-space:pre-wrap;word-break:break-all;min-height:50px;margin-bottom:.4rem;max-height:200px;overflow-y:auto}
.output-actions{display:flex;gap:.4rem;flex-wrap:wrap}
.btn-copy{background:#c12222;color:#fff;border:none;padding:.45rem .7rem;border-radius:6px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.btn-copy:hover{background:#d33}
.btn-reset{background:#222;color:#aaa;border:1px solid #333;padding:.45rem .7rem;border-radius:6px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.btn-reset:hover{background:#333;color:#fff}
.status-msg{text-align:center;padding:.4rem;font-size:.75rem;color:#888}
.footer{text-align:center;padding:2rem 0;font-size:.7rem;color:#555}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎯 Seleção Interativa — BuzzPop</h1>
    <div class="hint">⬇️ Para cada matéria: (1) escolha a <strong>imagem</strong> clicando nela (2) clique em <strong style="color:#22c55e">✓ Aprovar</strong> ou <strong style="color:#ef4444">✗ Rejeitar</strong>. No final, copie o código.</div>
  </div>
  <div class="stats" id="stats">
    <span>📰 <strong id="totalCount">0</strong></span>
    <span>✅ <strong id="approvedCount" style="color:#22c55e">0</strong></span>
    <span>❌ <strong id="rejectedCount" style="color:#ef4444">0</strong></span>
    <span>⏳ <strong id="pendingCount">0</strong></span>
  </div>
  <div id="articles"></div>
  <div class="output-section">
    <h3>📋 Código de Aprovação</h3>
    <div class="output-box" id="outputCode">Aguardando suas escolhas...</div>
    <div class="output-actions">
      <button class="btn-copy" onclick="copyCode()">📋 Copiar código</button>
      <button class="btn-reset" onclick="resetAll()">↻ Resetar</button>
      <button class="btn-reset" onclick="approveAll()">✓ Aprovar todos</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  </div>
  <div class="footer">BuzzPop Brasil &copy; 2026</div>
</div>
<script>
let articles = [];

async function loadData() {
  try {
    const r = await fetch('data.json');
    articles = await r.json();
    articles.forEach(a => { 
      a.status = 'pending';
      a.selectedImage = a.imageOptions.length > 0 ? 0 : -1;
    });
    renderAll();
    updateStats();
  } catch(e) {
    document.getElementById('articles').innerHTML = '<p style="color:#ef4444">Erro ao carregar dados.</p>';
  }
}

function renderAll() {
  const container = document.getElementById('articles');
  container.innerHTML = articles.map((a, idx) => {
    const imgOpts = a.imageOptions.map((opt, oi) => {
      const sel = a.selectedImage === oi ? 'selected' : '';
      const label = opt.credit ? opt.credit.slice(0,20) : 'Opção ' + (oi+1);
      return `<div class="img-opt ${sel}" onclick="selectImage(${idx},${oi})" data-idx="${idx}" data-opt="${oi}">
        <img src="${opt.url}" alt="Opção ${oi+1}" loading="lazy" onerror="this.parentElement.style.display='none'">
        <div class="img-label">📷 ${label}</div>
      </div>`;
    }).join('');

    return `
      <div class="card" id="card-${idx}" data-idx="${idx}">
        <div class="card-body">
          <div class="card-header">
            <span class="badge cat-badge">${a.category}</span>
            <span class="badge score-badge">🔥 ${a.score}</span>
          </div>
          <div class="card-title">
            <span class="card-num">${a.num}.</span>
            <span>${a.title}</span>
          </div>
          <p class="card-excerpt">${a.excerpt}</p>
          <span class="card-body-toggle" onclick="toggleBody(${idx})">📖 Ler matéria completa</span>
          <div class="card-fullbody" id="body-${idx}">${a.body.split('\n\n').map(p => '<p>'+p+'</p>').join('')}</div>
          <div class="img-select">${imgOpts}</div>
          <div class="actions">
            <button class="btn btn-approve" id="btn-approve-${idx}" onclick="setStatus(${idx},'approved')">✓ Aprovar</button>
            <button class="btn btn-reject" id="btn-reject-${idx}" onclick="setStatus(${idx},'rejected')">✗ Rejeitar</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function selectImage(idx, optIdx) {
  const a = articles[idx];
  a.selectedImage = optIdx;
  // Update visual
  const parent = document.querySelector(`#card-${idx} .img-select`);
  parent.querySelectorAll('.img-opt').forEach(el => {
    el.classList.toggle('selected', parseInt(el.dataset.opt) === optIdx);
  });
  updateCode();
}

function setStatus(idx, status) {
  articles[idx].status = status;
  const card = document.getElementById(`card-${idx}`);
  card.classList.remove('approved','rejected');
  if (status === 'approved') card.classList.add('approved');
  if (status === 'rejected') card.classList.add('rejected');
  
  const ba = document.getElementById(`btn-approve-${idx}`);
  const br = document.getElementById(`btn-reject-${idx}`);
  ba.classList.toggle('active', status === 'approved');
  ba.textContent = status === 'approved' ? '✓ Aprovado' : '✓ Aprovar';
  br.classList.toggle('active', status === 'rejected');
  br.textContent = status === 'rejected' ? '✗ Rejeitado' : '✗ Rejeitar';
  
  updateStats();
  updateCode();
}

function toggleBody(idx) {
  document.getElementById(`body-${idx}`).classList.toggle('show');
}

function updateStats() {
  const t = articles.length, ap = articles.filter(a=>a.status==='approved').length;
  const rj = articles.filter(a=>a.status==='rejected').length;
  document.getElementById('totalCount').textContent = t;
  document.getElementById('approvedCount').textContent = ap;
  document.getElementById('rejectedCount').textContent = rj;
  document.getElementById('pendingCount').textContent = t - ap - rj;
}

function updateCode() {
  const approved = articles.filter(a => a.status === 'approved');
  const rejected = articles.filter(a => a.status === 'rejected');
  const pending = articles.filter(a => a.status === 'pending');
  
  if (approved.length === 0 && rejected.length === 0) {
    document.getElementById('outputCode').textContent = 'Aguardando suas escolhas...';
    return;
  }
  
  let code = '';
  if (approved.length > 0) {
    code += '✅ APROVADOS: ' + approved.map(a => a.num).join(', ') + '\n';
    code += 'IDs: ' + approved.map(a => a.reviewId).join(',') + '\n';
    code += 'FOTOS: ' + approved.map(a => {
      const opt = a.imageOptions[a.selectedImage];
      return a.num + '=' + (opt ? opt.url : (a.image || 'auto'));
    }).join(' | ') + '\n';
  }
  if (rejected.length > 0) {
    code += '❌ REJEITADOS: ' + rejected.map(a => a.num).join(', ') + '\n';
  }
  if (pending.length > 0) {
    code += '⏳ PENDENTES: ' + pending.map(a => a.num).join(', ');
  }
  document.getElementById('outputCode').textContent = code;
  document.getElementById('statusMsg').textContent = `${approved.length} aprovados · ${rejected.length} rejeitados · ${pending.length} pendentes`;
}

function copyCode() {
  const code = document.getElementById('outputCode').textContent;
  if (!code || code === 'Aguardando suas escolhas...') return;
  navigator.clipboard.writeText(code).then(() => {
    document.getElementById('statusMsg').textContent = '📋 Código copiado!';
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = code; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
    document.getElementById('statusMsg').textContent = '📋 Código copiado!';
  });
}

function resetAll() {
  if (!confirm('Resetar todas as escolhas?')) return;
  articles.forEach((a, idx) => {
    a.status = 'pending';
    const card = document.getElementById(`card-${idx}`);
    card.classList.remove('approved','rejected');
    document.getElementById(`btn-approve-${idx}`).className = 'btn btn-approve';
    document.getElementById(`btn-approve-${idx}`).textContent = '✓ Aprovar';
    document.getElementById(`btn-reject-${idx}`).className = 'btn btn-reject';
    document.getElementById(`btn-reject-${idx}`).textContent = '✗ Rejeitar';
  });
  updateStats(); updateCode();
}

function approveAll() {
  articles.forEach((a, idx) => setStatus(idx, 'approved'));
}

loadData();
</script>
</body>
</html>
