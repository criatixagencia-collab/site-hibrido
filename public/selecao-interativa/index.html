<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seleção Interativa — BuzzPop</title>
<style>
*,::after,::before{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#fafafa;line-height:1.5}
.container{max-width:800px;margin:0 auto;padding:1.5rem 1rem}
.header h1{font-size:clamp(1.3rem,4vw,2rem);font-weight:900;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.25rem}
.header p{color:#888;font-size:.85rem;margin-bottom:1.5rem}
.stats{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem;padding:.75rem 1rem;background:#141414;border:1px solid #222;border-radius:10px;font-size:.82rem}
.stats span{display:flex;align-items:center;gap:.4rem}
.stats strong{color:#facc15;font-size:1rem}
.card{background:#141414;border:1px solid #222;border-radius:12px;margin-bottom:1rem;overflow:hidden;transition:border-color .2s,border-width .2s}
.card.approved{border-color:#22c55e;border-width:2px;background:#142014}
.card.rejected{border-color:#ef4444;border-width:2px;background:#201414;opacity:.6}
.card-img{width:100%;max-height:200px;object-fit:cover;display:block;background:#1a1a1a}
.card-body{padding:1rem}
.card-header{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem}
.badge{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;padding:.2rem .5rem;border-radius:6px}
.cat-badge{background:#c12222;color:#fff}
.score-badge{background:#1a1a1a;border:1px solid #333;color:#facc15}
.card-title{font-size:1rem;font-weight:700;color:#fafafa;line-height:1.3;margin-bottom:.35rem}
.card-excerpt{font-size:.82rem;color:#aaa;margin-bottom:.5rem}
.card-body-toggle{font-size:.72rem;color:#facc15;cursor:pointer;text-decoration:underline;display:inline-block;margin-bottom:.5rem}
.card-body-toggle:hover{color:#fff}
.card-fullbody{font-size:.85rem;color:#ccc;line-height:1.5;margin-bottom:.5rem;display:none;padding:.5rem;background:#0f0f0f;border-radius:6px;border:1px solid #222}
.card-fullbody.show{display:block}
.actions{display:flex;gap:.5rem;margin-top:.5rem}
.btn{flex:1;padding:.55rem;border:none;border-radius:8px;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;transition:all .15s}
.btn-approve{background:#1a3a1a;color:#22c55e;border:1px solid #22c55e33}
.btn-approve:hover,.btn-approve.active{background:#22c55e;color:#000}
.btn-approve.active{box-shadow:0 0 12px #22c55e44}
.btn-reject{background:#3a1a1a;color:#ef4444;border:1px solid #ef444433}
.btn-reject:hover,.btn-reject.active{background:#ef4444;color:#fff}
.btn-reject.active{box-shadow:0 0 12px #ef444444}
.btn-neutral{background:#222;color:#888;border:1px solid #333}
.btn-neutral:hover{background:#333;color:#fff}
.output-section{background:#0f0f0f;border:1px solid #333;border-radius:12px;padding:1rem;margin-top:1.5rem}
.output-section h3{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:#888;margin-bottom:.5rem}
.output-box{background:#050505;border:1px solid #222;border-radius:8px;padding:.75rem;font-family:monospace;font-size:.78rem;color:#facc15;white-space:pre-wrap;word-break:break-all;min-height:60px;margin-bottom:.5rem}
.output-actions{display:flex;gap:.5rem;flex-wrap:wrap}
.btn-copy{background:#c12222;color:#fff;border:none;padding:.5rem .8rem;border-radius:6px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;cursor:pointer}
.btn-copy:hover{background:#d33}
.btn-reset{background:#222;color:#aaa;border:1px solid #333;padding:.5rem .8rem;border-radius:6px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;cursor:pointer}
.btn-reset:hover{background:#333;color:#fff}
.status-msg{text-align:center;padding:.5rem;font-size:.78rem;color:#888}
.footer{text-align:center;padding:2rem 0;font-size:.72rem;color:#555}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎯 Seleção Interativa — BuzzPop</h1>
    <p>Clique em <strong style="color:#22c55e">✓ Aprovar</strong> ou <strong style="color:#ef4444">✗ Rejeitar</strong> cada matéria. No final copie o código.</p>
  </div>
  <div class="stats" id="stats">
    <span>📰 <strong id="totalCount">0</strong> matérias</span>
    <span>✅ Aprovados: <strong id="approvedCount" style="color:#22c55e">0</strong></span>
    <span>❌ Rejeitados: <strong id="rejectedCount" style="color:#ef4444">0</strong></span>
    <span>⏳ Pendentes: <strong id="pendingCount">0</strong></span>
  </div>
  <div id="articles"></div>
  <div class="output-section">
    <h3>📋 Código de Aprovação</h3>
    <div class="output-box" id="outputCode">Aguardando suas escolhas...</div>
    <div class="output-actions">
      <button class="btn-copy" onclick="copyCode()">📋 Copiar código</button>
      <button class="btn-reset" onclick="resetAll()">↻ Resetar</button>
      <button class="btn-reset" onclick="approveAll()">✓ Aprovar todos</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  </div>
  <div class="footer">BuzzPop Brasil &copy; 2026</div>
</div>
<script>
const articles = [];
let data = null;

async function loadData() {
  try {
    const r = await fetch('data.json');
    data = await r.json();
    data.forEach(a => { a.status = 'pending'; });
    renderArticles();
    updateStats();
  } catch(e) {
    document.getElementById('articles').innerHTML = '<p style="color:#ef4444">Erro ao carregar dados.</p>';
  }
}

function renderArticles() {
  const container = document.getElementById('articles');
  container.innerHTML = data.map((a, idx) => {
    const imgHtml = a.image ? `<img class="card-img" src="${a.image}" alt="${a.title}" loading="lazy" onerror="this.style.display='none'">` : '';
    return `
      <div class="card" id="card-${idx}" data-idx="${idx}">
        ${imgHtml}
        <div class="card-body">
          <div class="card-header">
            <span class="badge cat-badge">${a.category}</span>
            <span class="badge score-badge">🔥 Pontuação: ${a.score}</span>
          </div>
          <div class="card-title">
            <span style="display:inline-flex;align-items:center;justify-content:center;width:1.4rem;height:1.4rem;background:#c12222;color:#fff;border-radius:4px;font-size:.68rem;font-weight:900;margin-right:.35rem;flex-shrink:0">${a.num}.</span>
            ${a.title}
          </div>
          <p class="card-excerpt">${a.excerpt}</p>
          <span class="card-body-toggle" onclick="toggleBody(${idx})">📖 Ler matéria completa</span>
          <div class="card-fullbody" id="body-${idx}">${a.body}</div>
          <div class="actions">
            <button class="btn btn-approve" id="btn-approve-${idx}" onclick="setStatus(${idx},'approved')">✓ Aprovar</button>
            <button class="btn btn-reject" id="btn-reject-${idx}" onclick="setStatus(${idx},'rejected')">✗ Rejeitar</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function setStatus(idx, status) {
  data[idx].status = status;
  const card = document.getElementById(`card-${idx}`);
  card.classList.remove('approved','rejected');
  if (status === 'approved') card.classList.add('approved');
  if (status === 'rejected') card.classList.add('rejected');
  
  const btnApprove = document.getElementById(`btn-approve-${idx}`);
  const btnReject = document.getElementById(`btn-reject-${idx}`);
  btnApprove.classList.toggle('active', status === 'approved');
  btnApprove.textContent = status === 'approved' ? '✓ Aprovado' : '✓ Aprovar';
  btnReject.classList.toggle('active', status === 'rejected');
  btnReject.textContent = status === 'rejected' ? '✗ Rejeitado' : '✗ Rejeitar';
  
  updateStats();
  updateCode();
}

function toggleBody(idx) {
  const el = document.getElementById(`body-${idx}`);
  el.classList.toggle('show');
}

function updateStats() {
  const total = data.length;
  const approved = data.filter(a => a.status === 'approved').length;
  const rejected = data.filter(a => a.status === 'rejected').length;
  const pending = total - approved - rejected;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('approvedCount').textContent = approved;
  document.getElementById('rejectedCount').textContent = rejected;
  document.getElementById('pendingCount').textContent = pending;
}

function updateCode() {
  const approved = data.filter(a => a.status === 'approved');
  const rejected = data.filter(a => a.status === 'rejected');
  const pending = data.filter(a => a.status === 'pending');
  
  if (approved.length === 0 && rejected.length === 0) {
    document.getElementById('outputCode').textContent = 'Aguardando suas escolhas...';
    return;
  }
  
  let code = '';
  if (approved.length > 0) {
    code += '✅ APROVADOS: ' + approved.map(a => a.num).join(', ') + '\n';
    code += 'IDs: ' + approved.map(a => a.reviewId).join(',') + '\n';
  }
  if (rejected.length > 0) {
    code += '❌ REJEITADOS: ' + rejected.map(a => a.num).join(', ') + '\n';
  }
  if (pending.length > 0) {
    code += '⏳ PENDENTES: ' + pending.map(a => a.num).join(', ');
  }
  document.getElementById('outputCode').textContent = code;
  document.getElementById('statusMsg').textContent = `${approved.length} aprovados · ${rejected.length} rejeitados · ${pending.length} pendentes`;
}

function copyCode() {
  const code = document.getElementById('outputCode').textContent;
  if (!code || code === 'Aguardando suas escolhas...') return;
  navigator.clipboard.writeText(code).then(() => {
    document.getElementById('statusMsg').textContent = '📋 Código copiado!';
    setTimeout(() => updateStats(), 1500);
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = code;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    document.getElementById('statusMsg').textContent = '📋 Código copiado!';
  });
}

function resetAll() {
  if (!confirm('Resetar todas as escolhas?')) return;
  data.forEach((a, idx) => {
    a.status = 'pending';
    const card = document.getElementById(`card-${idx}`);
    card.classList.remove('approved','rejected');
    const ba = document.getElementById(`btn-approve-${idx}`);
    const br = document.getElementById(`btn-reject-${idx}`);
    ba.classList.remove('active');
    ba.textContent = '✓ Aprovar';
    br.classList.remove('active');
    br.textContent = '✗ Rejeitar';
  });
  updateStats();
  updateCode();
}

function approveAll() {
  data.forEach((a, idx) => {
    setStatus(idx, 'approved');
  });
}

loadData();
</script>
</body>
</html>
